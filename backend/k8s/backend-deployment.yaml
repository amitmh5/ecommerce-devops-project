apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ecommerce

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      imagePullSecrets:
      - name: ecr-secret

      containers:
      - name: backend
        image: 886181574480.dkr.ecr.ap-south-1.amazonaws.com/backend:v1
        ports:
        - containerPort: 8081
