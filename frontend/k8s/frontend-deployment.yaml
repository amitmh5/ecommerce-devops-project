apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: ecommerce

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      imagePullSecrets:
      - name: ecr-secret

      containers:
      - name: frontend

        image: 886181574480.dkr.ecr.ap-south-1.amazonaws.com/frontend:v1

        ports:
        - containerPort: 80
